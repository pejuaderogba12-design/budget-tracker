<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSmart Smart Budget Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="budget-container">
      <h1>Financial Dashboard</h1>

      <section class="budget-setup">
        <input
          type="number"
          id="budget-input"
          placeholder="Set Monthly Budget (£)"
          min="0"
        />
        <button id="set-budget-btn">Update Budget</button>
      </section>

      <section class="dashboard">
        <div class="card bg-budget">
          <h3>Total Budget</h3>
          <p>£<span id="total-budget">0.00</span></p>
        </div>
        <div class="card bg-spent">
          <h3>Total Spent</h3>
          <p>£<span id="total-spent">0.00</span></p>
        </div>
        <div class="card bg-balance" id="balance-card">
          <h3>Remaining Balance</h3>
          <p>£<span id="remaining-balance">0.00</span></p>
        </div>
      </section>

      <div class="main-grid">
        <section class="form-section">
          <h2>Log New Expense</h2>
          <form id="expense-form">
            <div class="form-group">
              <label for="expense-name">Expense Name</label>
              <input
                type="text"
                id="expense-name"
                placeholder="e.g., Groceries, Bills, Cinema"
                required
              />
            </div>
            <div class="form-group">
              <label for="expense-amount">Amount (£)</label>
              <input
                type="number"
                id="expense-amount"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
              />
            </div>
            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category" required>
                <option value="" disabled selected>Select a category...</option>
                <option value="Food">Food & Dining</option>
                <option value="Utilities">Bills & Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Transport">Transportation</option>
                <option value="Other">Other Miscellaneous</option>
              </select>
            </div>
            <button type="submit" class="submit-btn">Add Expense</button>
          </form>
        </section>

        <section class="history-section">
          <h2>Expense Ledger History</h2>
          <ul id="expense-list"></ul>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
